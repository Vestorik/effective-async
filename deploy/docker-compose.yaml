services:
  postgres:
    image: postgres:18-alpine  # <-- используем легковесный образ PostgreSQL 16
    container_name: effect_mobile_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}          
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB:-effect_mobile_db}      
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-effect_mobile_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine 
    container_name: effect_mobile_redis
    restart: unless-stopped
    environment:
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: ..
      dockerfile: deploy/dockerfile
    container_name: effect_mobile_app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8000}:8000"
    volumes:

      - ../app:/app/app
      - ../deploy/.env:/app/deploy/.env
      - app_logging:/app/logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Если нужно использовать конкретный .env файл для переменных окружения
    env_file:
      - ../deploy/.env

volumes:
  postgres_data:
  redis_data:
  app_logging: